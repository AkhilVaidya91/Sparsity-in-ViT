[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsity-in-vit"
version = "1.0.0"
description = "Vision Transformer pruning and adversarial robustness experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
    "mlflow>=2.12",
]

[project.scripts]
vit-pruning = "vit_pruning.pipeline:main"

[tool.setuptools]
packages = ["vit_pruning"]
package-dir = { vit_pruning = "src" }

[tool.uv]
package = true
